#cloud-config
# Prepara a VM para receber a aplicação; o código e o .env chegam pelo pipeline de deploy.
package_update: true
package_upgrade: true
packages:
  - rsync

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker ubuntu
  # As imagens Ubuntu da Oracle rejeitam tudo além do SSH no iptables da própria VM.
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - iptables -I INPUT 6 -p udp --dport 443 -j ACCEPT
  - netfilter-persistent save
  - install -d -o ubuntu -g ubuntu /opt/lingualab
