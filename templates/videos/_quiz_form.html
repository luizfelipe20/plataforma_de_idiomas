{% comment %}Formulário de quiz a partir de um segmento (`segment_index`). Usa a combinação padrão de tipos.{% endcomment %}
<form method="post" action="{% url 'videos:media_quiz_create' media.pk %}" class="form-grid">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <input type="hidden" name="source" value="{% if segment_index is not None %}segment:{{ segment_index }}{% else %}all{% endif %}">
  <div class="field field-full">
    <label for="quiz-title-{{ segment_index|default:'all' }}">Título (opcional)</label>
    <input type="text" id="quiz-title-{{ segment_index|default:'all' }}" name="title" maxlength="120">
  </div>
  <div class="form-actions field-full">
    <button class="btn btn-primary" type="submit" data-loading-text="Gerando quiz…">Gerar quiz</button>
    <button class="btn" type="submit" name="custom" value="1">Escolher tipos e quantidades</button>
  </div>
  <p class="muted note field-full">O quiz fica pronto para responder assim que é gerado. As perguntas de compreensão auditiva tocam o trecho real do áudio tratado.</p>
</form>
