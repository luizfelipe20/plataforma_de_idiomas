{% load core_tags %}
{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Paginação">
  {% if page.has_previous %}<a class="btn btn-sm" href="?{% query_transform page=page.previous_page_number %}">← Anterior</a>{% endif %}
  <span class="muted">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-sm" href="?{% query_transform page=page.next_page_number %}">Próxima →</a>{% endif %}
</nav>
{% endif %}
